version: '3'

tasks:
    default:
        desc: Show available tasks.
        cmds:
            - task --list

    open:
        desc: Start the container and open the site in the browser.
        cmds:
            - docker compose up -d
            - |
                until curl -fsS http://localhost:3000 >/dev/null; do
                    sleep 1
                done
            - xdg-open http://localhost:3000

    down:
        desc: Stop and remove the container.
        cmds:
            - docker compose down

    build:
        desc: Build the Docker image.
        cmds:
            - docker compose build

    shell:
        desc: Open a shell inside the container.
        cmds:
            - docker compose run --rm web sh

    lock:
        desc: Generate or update yarn.lock.
        cmds:
            - docker compose run --rm web yarn install --registry https://registry.npmjs.org --network-timeout 300000